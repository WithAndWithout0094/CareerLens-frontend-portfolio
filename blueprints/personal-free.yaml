# Personal trial only. Select this Blueprint path in your own Render workspace.
# These resource names must not be changed to the shared team3 resource names.
services:
  - type: web
    name: careerlens-personal-web
    runtime: python
    plan: free
    region: singapore
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt
    # Explicit opt-in setup: only an empty DB or matching completed trial is accepted.
    startCommand: python -m scripts.bootstrap_personal_render && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerlens-personal-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_DIMENSIONS
        value: '1536'
      - key: APP_ENV
        value: production
      - key: AUTH_ENABLED
        value: 'true'
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_PUBLIC_ORIGIN
        sync: false
      - key: CAREERLENS_GUEST_ANALYSIS
        value: '1'
      - key: REDIS_URL
        fromService:
          name: careerlens-personal-events
          type: keyvalue
          property: connectionString
      - key: WORKER_CONCURRENCY
        value: '3'
      - key: LLM_CONCURRENCY
        value: '3'
      - key: DAILY_ANALYSIS_LIMIT
        value: '60'
      - key: MEMBER_DAILY_ANALYSIS_LIMIT
        value: '10'
      - key: ADMIN_USER_IDS
        sync: false
  - type: keyvalue
    name: careerlens-personal-events
    plan: free
    region: singapore
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: careerlens-personal-db
    databaseName: careerlens
    user: careerlens
    plan: free
    region: singapore
    postgresMajorVersion: '17'
    ipAllowList: []
